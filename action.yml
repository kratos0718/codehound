name: "codehound"
description: "AST-based static analyzer for async-safety, resource-leak, and correctness bugs in Python."
author: "kratos0718"
branding:
  icon: "search"
  color: "green"

inputs:
  path:
    description: "File or directory to scan"
    required: false
    default: "."
  select:
    description: "Comma-separated check codes to run, e.g. CH001,CH006 (default: all)"
    required: false
    default: ""
  fail-on-findings:
    description: "Fail the workflow step if any findings are reported"
    required: false
    default: "true"
  upload-sarif:
    description: "Upload results to the GitHub Code Scanning (Security) tab"
    required: false
    default: "true"
  codehound-version:
    description: "Pin a specific codehound version (default: latest from PyPI)"
    required: false
    default: ""

outputs:
  finding-count:
    description: "Total number of findings reported"
    value: ${{ steps.scan.outputs.finding-count }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install codehound
      shell: bash
      run: |
        if [ -n "${{ inputs.codehound-version }}" ]; then
          pip install "codehound==${{ inputs.codehound-version }}"
        else
          pip install codehound
        fi

    - name: Run codehound
      id: scan
      shell: bash
      run: |
        select_arg=()
        if [ -n "${{ inputs.select }}" ]; then
          select_arg=(--select "${{ inputs.select }}")
        fi
        codehound scan "${{ inputs.path }}" "${select_arg[@]}" --format json --exit-zero > codehound-results.json
        python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
        import json
        findings = json.load(open("codehound-results.json"))
        for f in findings:
            print(f"{f['path']}:{f['line']}:{f['col']}: {f['code']} {f['message']}")
        print(f"Found {len(findings)} issue(s)")
        PYEOF
        count=$(python3 -c "import json; print(len(json.load(open('codehound-results.json'))))")
        echo "finding-count=$count" >> "$GITHUB_OUTPUT"

    - name: Convert to SARIF
      if: inputs.upload-sarif == 'true'
      shell: bash
      run: |
        python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PYEOF'
        import json
        from codehound.checks import get_checks
        from codehound.core import Finding
        from codehound.sarif import to_sarif

        select = "${{ inputs.select }}"
        checks = get_checks(select.split(",") if select else None)
        raw = json.load(open("codehound-results.json"))
        findings = [Finding(**f) for f in raw]
        json.dump(to_sarif(findings, [type(c) for c in checks]), open("codehound-results.sarif", "w"))
        PYEOF

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codehound-results.sarif

    - name: Fail on findings
      shell: bash
      run: |
        count="${{ steps.scan.outputs.finding-count }}"
        if [ "${{ inputs.fail-on-findings }}" == "true" ] && [ "$count" -gt 0 ]; then
          exit 1
        fi
